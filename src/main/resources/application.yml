server:
  port: 8082

spring:
  application:
    name: ziwen
  # 生字表所在的 SQLite（v0.4 起）：单文件嵌入式库，无服务器进程。
  # 库文件随项目生成在运行目录，schema.sql / data.sql 由下方 sql.init 启动时执行
  datasource:
    url: jdbc:sqlite:${AI_SQLITE_FILE:ziwen.sqlite.db}
  # 每次启动都执行建表与种子数据：schema 用 IF NOT EXISTS、data 用 INSERT OR IGNORE，
  # 重复启动幂等，已有数据不会被重建覆盖
  sql:
    init:
      mode: always
      # 脚本位置显式写出（与默认值相同）：执行哪些脚本、什么顺序，一眼可见
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  # 对话记忆所在的 Redis（v0.1.1 起；docker compose up -d 一条命令起一个）
  data:
    redis:
      host: ${AI_REDIS_HOST:localhost}
      port: ${AI_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis1234}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

# AI 配置（敏感信息一律环境变量注入，勿硬编码）
ai:
  # 对话模型：OpenAI 兼容协议，base-url 指向 DeepSeek / 通义 / OneAPI 均可
  chat:
    base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_CHAT_API_KEY:}
    model-name: ${AI_CHAT_MODEL:deepseek-v4-pro}

    temperature: 0.7
    # 分诊（RouterAgent）的温度（v0.5.1 起）：与对话模型同一套地址密钥，只关到 0——分类不带随机性，同一句话每次归同一类
    router-temperature: 0.0
  # embedding 模型：第二提供方。DeepSeek 只有 chat 没有 embedding，
  # 这里指向通义千问 DashScope 的 OpenAI 兼容端点——同一套协议模块，只换地址和模型名
  embedding:
    base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_EMBEDDING_API_KEY:}
    model-name: ${AI_EMBEDDING_MODEL:text-embedding-v3}
  # 古诗 RAG 检索
  rag:
    max-results: 3   #每次检索最多带回几首古诗
    # 相似度阈值（v0.3.1 起）：低于它的命中一律丢弃，空结果才真正意味着“没查到”。
    # 默认 0.78 来自 v0.3 实测分布：对的《望庐山瀑布》0.817，不相干的诗也有 0.74x。
    # 换语料要用标注问题扫分数分布重新标定
    min-score: 0.78
    # 向量库 Qdrant（v0.2.1 起）：6334 是 gRPC 端口（程序走这个），6333 留给浏览器 dashboard
    qdrant:
      host: ${AI_QDRANT_HOST:localhost}
      port: ${AI_QDRANT_PORT:6334}
      collection-name: ${AI_QDRANT_COLLECTION:ziwen_poems}
      use-tls: ${AI_QDRANT_USE_TLS:false}
      api-key: ${AI_QDRANT_API_KEY:}   #本地 compose 无鉴权留空；Qdrant Cloud 才需要
  # 多轮对话记忆（窗口策略 + Redis 存储）
  memory:
    # 一轮带工具的对话占 4 条（问题、申请单、回执、回答），20 条存不下几轮，v0.3.2 起放宽到 30
    max-messages: 30
    key-prefix: "ziwen:chat:memory:"   #完整 key = 前缀 + sessionId（parentId:childId:windowId）
    ttl: 7d           #滑动过期：每轮对话后刷新，连续 7 天不聊的会话自动清理
  # 工具循环护栏（v0.3.2 起）：软闸劝停 + 硬保险丝
  tool:
    max-calls-per-turn: 3   #单轮内工具调用上限，超出回劝停文本
    max-round-trips: 10     #框架层保险丝（默认 100），超限整轮异常终止
  # 登录认证（v0.5 起）：token 存 Redis、滑动过期，校验一次续一次
  auth:
    token-ttl: 7d   #连续 7 天不打开字问，登录态自动失效，需重新登录

logging:
  charset:
    console: UTF-8
  level:
    dev.langchain4j: INFO
