<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 字问</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f4ee;
      display: flex; justify-content: center;
      min-height: 100vh; padding: 24px 16px;
    }
    .login {
      width: 100%; max-width: 360px; margin-top: 12vh;
      background: #fff; border-radius: 16px; padding: 36px 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    .login h1 { text-align: center; font-size: 26px; color: #4a3b2a; }
    .login p { text-align: center; font-size: 13px; color: #9a8f80; margin: 8px 0 28px; }
    .login label { display: block; font-size: 13px; color: #6b5d49; margin: 14px 0 6px; }
    .login input {
      width: 100%; padding: 12px 14px; border: 1px solid #ddd2c2;
      border-radius: 10px; font-size: 15px; outline: none;
    }
    .login input:focus { border-color: #b5a488; }
    .login .auth-error { color: #c0392b; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
    .login .buttons { display: flex; gap: 10px; margin-top: 14px; }
    .login .buttons button { flex: 1; }
    button {
      padding: 12px 20px; background: #6b8e4e; color: #fff; border: none;
      border-radius: 10px; font-size: 15px; cursor: pointer;
    }
    button.secondary {
      background: #fff; color: #6b8e4e; border: 1px solid #9db87f;
    }
    button.secondary:hover { background: #f0f4e8; }
  </style>
</head>
<body>

<div class="login">
  <h1>字问</h1>
  <p>问一个字，问一首诗，陪娃学习</p>
  <label>家长用户名</label>
  <input id="username" autocomplete="username">
  <label>密码</label>
  <input id="password" type="password" autocomplete="current-password">
  <div class="auth-error" id="authError"></div>
  <div class="buttons">
    <button id="register" type="button" class="secondary">注册</button>
    <button id="login" type="button">登录</button>
  </div>
</div>

<script>
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const authError = document.getElementById('authError');

  // 对话页跳回来时可能捎句话（如"登录过期了"），有就展示
  const tip = new URLSearchParams(location.search).get('msg');
  if (tip) authError.textContent = tip;

  // ===== 注册 / 登录：token 存本地（localStorage），之后每个请求由页面放进 Authorization 头 =====
  async function authenticate(path) {
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    if (!username || !password) { authError.textContent = '用户名和密码都要填'; return; }
    authError.textContent = '';
    try {
      const response = await fetch('/api/auth/' + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const body = await response.json();
      if (body.code !== 0) throw new Error(body.message);
      localStorage.setItem('ziwen-token', body.data);
      location.href = '/';
    } catch (error) {
      authError.textContent = error.message;
    }
  }

  document.getElementById('register').addEventListener('click', () => authenticate('register'));
  document.getElementById('login').addEventListener('click', () => authenticate('login'));
  passwordInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') authenticate('login');
  });
  usernameInput.focus();

  // ===== 已登录的人误进本页：本地 token 还有效就直接送回对话页 =====
  (async function init() {
    const token = localStorage.getItem('ziwen-token');
    if (!token) return; // 没存过 token，老老实实登录
    try {
      const response = await fetch('/api/children', { headers: { Authorization: 'Bearer ' + token } });
      if (response.status === 401) {
        localStorage.removeItem('ziwen-token'); // 过期 token 留着只会误导下次探测
        return;
      }
      if (response.ok) location.href = '/';
    } catch { /* 问不出来就留在登录页，不影响填表 */ }
  })();
</script>
</body>
</html>
