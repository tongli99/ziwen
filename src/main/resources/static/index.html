<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字问 · 伴读小伙伴</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f4ee;
      display: flex; justify-content: center;
      min-height: 100vh; padding: 24px 16px;
    }
    .app {
      width: 100%; max-width: 840px; display: flex; gap: 12px;
      min-height: calc(100vh - 48px);
    }
    /* 左侧：会话 tab 列表 */
    .sidebar {
      width: 180px; flex-shrink: 0; background: #fff; border-radius: 12px;
      padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
      display: flex; flex-direction: column; gap: 10px;
    }
    #newChat {
      background: #fff; color: #6b8e4e; border: 1px dashed #9db87f;
      padding: 10px 12px; font-size: 14px;
    }
    #newChat:hover { background: #f0f4e8; }
    #tabs { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    .tab {
      display: flex; align-items: center; gap: 4px;
      padding: 8px 10px; border-radius: 8px; font-size: 13px; color: #6b5d49;
      cursor: pointer;
    }
    .tab:hover { background: #f5efe3; }
    .tab.active { background: #e8f0de; color: #3d5226; font-weight: 600; }
    .tab-title {
      flex: 1; min-width: 0; text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tab-close {
      flex-shrink: 0; padding: 0 4px; font-size: 15px; line-height: 1;
      background: transparent; border: none; border-radius: 4px;
      color: #b0a695; cursor: pointer;
    }
    .tab-close:hover { color: #c0392b; }
    /* 右侧：聊天主区 */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    header { text-align: center; margin-bottom: 16px; }
    header h1 { font-size: 22px; color: #4a3b2a; }
    header p { font-size: 13px; color: #9a8f80; margin-top: 4px; }
    #chat {
      flex: 1; overflow-y: auto; background: #fff; border-radius: 12px;
      padding: 16px; min-height: 300px; max-height: 60vh;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .msg { margin: 8px 0; line-height: 1.7; font-size: 15px; white-space: pre-wrap; }
    .user { text-align: right; }
    .user span {
      background: #e8f0de; color: #3d5226; padding: 8px 12px;
      border-radius: 12px 12px 2px 12px; display: inline-block; text-align: left;
    }
    .ai span {
      background: #f5efe3; color: #4a3b2a; padding: 8px 12px;
      border-radius: 12px 12px 12px 2px; display: inline-block;
    }
    /* 工具状态行（"字问先生正在翻古诗书…"）：回答的第一个 token 一到就撤 */
    .status { text-align: center; font-size: 12px; color: #b0a695; margin: 6px 0; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input {
      flex: 1; padding: 12px 14px; border: 1px solid #ddd2c2;
      border-radius: 10px; font-size: 15px; outline: none; background: #fff;
    }
    input:focus { border-color: #b5a488; }
    button {
      padding: 12px 20px; background: #6b8e4e; color: #fff; border: none;
      border-radius: 10px; font-size: 15px; cursor: pointer;
    }
    button:disabled { background: #b8c4ab; cursor: not-allowed; }
    .hint { text-align: center; font-size: 12px; color: #b0a695; margin-top: 8px; }
    /* 窄屏：左侧 tab 栏变成顶部横条，聊天区不至于被挤没 */
    @media (max-width: 720px) {
      .app { flex-direction: column; min-height: 0; }
      .sidebar { width: 100%; flex-direction: row; align-items: center; }
      #newChat { flex-shrink: 0; width: auto; }
      #tabs { flex: 1; flex-direction: row; gap: 6px; overflow-x: auto; overflow-y: hidden; }
      .tab { flex-shrink: 0; max-width: 140px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button id="newChat" type="button">＋ 新聊天</button>
    <nav id="tabs"></nav>
  </aside>
  <main class="main">
    <header>
      <h1>字问先生</h1>
      <p>问一个字，问一首诗，陪娃学习</p>
    </header>
    <div id="chat"></div>
    <form id="form">
      <input id="q" placeholder="例如：二年级那首写瀑布的诗，背给我听？" autocomplete="off" autofocus>
      <button id="send" type="submit">问</button>
    </form>
    <p class="hint">当前会话 <span id="sid"></span> · 每个 tab 一个会话，聊天记录缓存在浏览器本地</p>
  </main>
</div>
<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('q');
  const send = document.getElementById('send');
  const tabsNav = document.getElementById('tabs');
  const newChatButton = document.getElementById('newChat');
  const sidLabel = document.getElementById('sid');

  // ===== 会话（tab）管理：会话列表 + 各会话消息都存 localStorage，刷新不丢 =====
  const SESSIONS_KEY = 'ziwen-sessions';
  const LEGACY_SESSION_KEY = 'ziwen-session'; // 旧版只存单个会话 id

  function loadSessions() {
    try {
      return JSON.parse(localStorage.getItem(SESSIONS_KEY)) || [];
    } catch {
      return []; // 本地存储损坏时当作没有会话，重新开始
    }
  }

  function saveSessions() {
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
  }

  // 消息体按会话分开存，避免每次落盘都搬动全部会话的历史
  function messagesKey(sessionId) {
    return 'ziwen-msgs:' + sessionId;
  }

  function getMessages(sessionId) {
    if (!messagesBySession.has(sessionId)) {
      try {
        messagesBySession.set(sessionId, JSON.parse(localStorage.getItem(messagesKey(sessionId))) || []);
      } catch {
        messagesBySession.set(sessionId, []);
      }
    }
    return messagesBySession.get(sessionId);
  }

  function saveMessages(sessionId) {
    localStorage.setItem(messagesKey(sessionId), JSON.stringify(messagesBySession.get(sessionId) || []));
  }

  let sessions = loadSessions();
  if (sessions.length === 0) {
    // 兼容旧版：沿用原来的会话 id，服务端那份记忆还能接上。
    // 服务端历史没有查询接口，页面展示从本地缓存开始积累。
    const legacySessionId = localStorage.getItem(LEGACY_SESSION_KEY);
    sessions = [{ id: legacySessionId || crypto.randomUUID(), title: '聊天1' }];
    localStorage.removeItem(LEGACY_SESSION_KEY);
    saveSessions();
  }
  // 旧版的"新聊天"占位标题按新规则补上编号
  if (sessions.some((s) => s.title === '新聊天')) {
    for (const session of sessions) {
      if (session.title === '新聊天') session.title = nextSessionTitle();
    }
    saveSessions();
  }
  let activeSessionId = sessions[0].id;
  const messagesBySession = new Map(); // 会话 id -> 消息数组（内存缓存，落盘走 localStorage）

  let activeStream = null; // 正在流式输出的那条回答：{ es, sessionId, message }

  function bubble(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const span = document.createElement('span');
    span.textContent = text;
    div.appendChild(span);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return span;
  }

  function renderTabs() {
    tabsNav.innerHTML = '';
    for (const session of sessions) {
      const tab = document.createElement('div');
      tab.className = 'tab' + (session.id === activeSessionId ? ' active' : '');
      tab.addEventListener('click', () => switchTo(session.id));

      const title = document.createElement('span');
      title.className = 'tab-title';
      title.textContent = session.title;
      tab.appendChild(title);

      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'tab-close';
      close.textContent = '×';
      close.title = '删除该会话';
      close.addEventListener('click', (e) => {
        e.stopPropagation(); // 点 × 只删除，不触发切换会话
        removeSession(session.id);
      });
      tab.appendChild(close);

      tabsNav.appendChild(tab);
    }
  }

  // 会话命名：聊天1、聊天2…取现有编号最大值 +1，删掉中间的也不重复
  function nextSessionTitle() {
    let maxNumber = 0;
    for (const session of sessions) {
      const match = session.title.match(/^聊天(\d+)$/);
      if (match) maxNumber = Math.max(maxNumber, Number(match[1]));
    }
    return '聊天' + (maxNumber + 1);
  }

  // 删除会话：清本地缓存，并让服务端同步删掉 Redis 里的记忆
  function removeSession(sessionId) {
    if (activeStream && activeStream.sessionId === sessionId) {
      activeStream.es.close(); // 该会话还在流式输出：先断开，保留已生成的半截
      finalizeStream();
    }
    // 本地删除不依赖后端成功，失败也不阻塞 UI
    fetch('/api/chat/' + encodeURIComponent(sessionId), { method: 'DELETE' }).catch(() => {});
    sessions = sessions.filter((s) => s.id !== sessionId);
    messagesBySession.delete(sessionId);
    localStorage.removeItem(messagesKey(sessionId));
    saveSessions();

    if (sessionId === activeSessionId) {
      if (sessions.length === 0) createSession(); // 全删光了：自动新开一个空会话
      switchTo(sessions[0].id);
    } else {
      renderTabs();
    }
  }

  function renderChat() {
    chat.innerHTML = '';
    statusLine = null; // 状态行是临时元素，随聊天区一起清掉，别留悬空引用
    for (const message of getMessages(activeSessionId)) {
      bubble(message.role, message.text);
    }
    chat.scrollTop = chat.scrollHeight;
  }

  function switchTo(sessionId) {
    if (sessionId === activeSessionId) return;
    activeSessionId = sessionId;
    renderTabs();
    renderChat();
    sidLabel.textContent = sessionId.slice(0, 8);
    input.focus();
  }

  // 建新会话：编号取名，新会话排最前
  function createSession() {
    const session = { id: crypto.randomUUID(), title: nextSessionTitle() };
    sessions.unshift(session);
    saveSessions();
    messagesBySession.set(session.id, []);
    saveMessages(session.id);
    return session;
  }

  newChatButton.addEventListener('click', () => {
    if (activeStream) {
      // 上一个回答还在流式输出：断开连接，保留已生成的部分
      activeStream.es.close();
      finalizeStream();
    }
    switchTo(createSession().id);
  });

  // 流式收尾：落盘回答、恢复输入框。正常结束和出错都会走到这里
  function finalizeStream() {
    if (!activeStream) return;
    const sessionId = activeStream.sessionId;
    activeStream = null;
    hideStatus();
    saveMessages(sessionId);
    send.disabled = false;
    input.focus();
  }

  // 只把最新回答写进当前会话的最后一个气泡；流式期间切走再切回也能接上
  function updateLiveBubble() {
    if (!activeStream || activeStream.sessionId !== activeSessionId) return;
    const lastBubble = chat.lastElementChild;
    if (lastBubble) lastBubble.firstElementChild.textContent = activeStream.message.text;
  }

  // ===== 工具状态行：SSE 具名 status 事件（"字问先生正在翻古诗书…"） =====
  // 工具执行期间一个 token 都不吐，这行字就是那几秒白屏里唯一的动静；
  // 回答的第一个 token 一到就撤，不需要"查完了"事件
  let statusLine = null;

  function showStatus(text) {
    if (!activeStream || activeStream.sessionId !== activeSessionId) return;
    if (!statusLine) {
      statusLine = document.createElement('div');
      statusLine.className = 'status';
      chat.appendChild(statusLine);
    }
    statusLine.textContent = text;
    chat.scrollTop = chat.scrollHeight;
  }

  function hideStatus() {
    if (statusLine) { statusLine.remove(); statusLine = null; }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question || activeStream) return;
    input.value = '';

    const messages = getMessages(activeSessionId);
    messages.push({ role: 'user', text: question });
    bubble('user', question);

    const aiMessage = { role: 'ai', text: '' };
    messages.push(aiMessage);
    bubble('ai', '');
    saveMessages(activeSessionId);

    send.disabled = true;

    // SSE 流式：EventSource 只支持 GET
    const es = new EventSource(
      '/api/chat/stream?sessionId=' + encodeURIComponent(activeSessionId) +
      '&question=' + encodeURIComponent(question));
    activeStream = { es, sessionId: activeSessionId, message: aiMessage };

    es.onmessage = (ev) => {
      hideStatus(); // token 一到，状态行的使命就结束了
      aiMessage.text += ev.data;
      updateLiveBubble();
      chat.scrollTop = chat.scrollHeight;
    };
    // 工具状态是具名事件，和逐 token 的默认事件分流（EventSource 按事件名分派）
    es.addEventListener('status', (ev) => showStatus(ev.data));
    // 连接关闭（正常结束也走这里）都会触发 onerror，兜底提示
    es.onerror = () => {
      es.close();
      if (!aiMessage.text) aiMessage.text = '（出错了，请稍后再试）';
      updateLiveBubble();
      finalizeStream();
    };
  });

  renderTabs();
  renderChat();
  sidLabel.textContent = activeSessionId.slice(0, 8);
</script>
</body>
</html>
